name: Live internship ingestion

on:
  schedule:
    # Avoid the top of the hour, when scheduled GitHub Actions are more likely
    # to be delayed. This runs twice an hour on the default branch.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-internship-ingestion
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Internship Pilot live maintenance
        env:
          CRON_SECRET: ${{ secrets.INTERNSHIP_PILOT_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing repository Actions secret: INTERNSHIP_PILOT_CRON_SECRET"
            exit 1
          fi

          echo "Triggering employer ingestion..."
          curl --fail-with-body --silent --show-error \
            --max-time 20 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            https://internship-pilot.vercel.app/api/cron/job-ingestion/trigger
          echo

          echo "Triggering automatic AI scoring..."
          curl --fail-with-body --silent --show-error \
            --max-time 20 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            https://internship-pilot.vercel.app/api/cron/ai-scoring/trigger
          echo
