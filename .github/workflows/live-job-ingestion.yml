name: Hosted job-ingestion lanes

# Cadence, and why it is here rather than in vercel.json or QStash.
#
# GitHub Actions is the ONE production scheduler for job ingestion. There must
# never be a second scheduler (Vercel cron, QStash, or anything else) running
# these same routes on an overlapping cadence — that duplication (a QStash
# */5 schedule racing this workflow's own */5 "fresh" lane, plus vercel.json
# separately re-triggering the daily lanes GitHub Actions already owns) was
# the largest single driver of exceeding the Prisma Postgres Free-plan
# database-operations budget. See the DATABASE USAGE DIAGNOSTIC /
# DATABASE EFFICIENCY REPAIR reports for the full accounting.
#
# Cadence was deliberately widened as part of that repair:
#   fresh       every 10 minutes (was 5)  — still fast enough that a new
#                                            posting shows up within minutes
#   standard    every 60 minutes (was every 30 minutes)
#   maintenance once daily (unchanged)
#
# GitHub's own floor is five minutes, and scheduled runs are queued rather than
# guaranteed on time — under load a tick can be late or dropped. That is an
# acknowledged limit of this fallback, not a claim of exact-minute precision.

on:
  schedule:
    - cron: "*/10 * * * *"   # LANE A — fresh
    - cron: "27 * * * *"     # LANE B — standard
    - cron: "25 8 * * *"     # LANE C — maintenance
  workflow_dispatch:
    inputs:
      lane:
        description: Which ingestion lane to run
        required: true
        default: fresh
        type: choice
        options: [fresh, standard, maintenance]

permissions:
  contents: read

env:
  BASE: https://internship-pilot.vercel.app

jobs:
  fresh:
    name: Lane A — fresh opportunities
    if: github.event.schedule == '*/10 * * * *' || github.event.inputs.lane == 'fresh'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: ingestion-lane-fresh
      cancel-in-progress: false
    steps:
      - name: Poll the fresh lane
        env:
          CRON_SECRET: ${{ secrets.INTERNSHIP_PILOT_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing repository Actions secret: INTERNSHIP_PILOT_CRON_SECRET"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 290 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$BASE/api/cron/job-ingestion/fresh"
          echo

  standard:
    name: Lane B — standard polling cycle
    if: github.event.schedule == '27 * * * *' || github.event.inputs.lane == 'standard'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: ingestion-lane-standard
      cancel-in-progress: false
    steps:
      - name: Poll the standard lane
        env:
          CRON_SECRET: ${{ secrets.INTERNSHIP_PILOT_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing repository Actions secret: INTERNSHIP_PILOT_CRON_SECRET"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 295 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$BASE/api/cron/job-ingestion/standard"
          echo

  maintenance:
    name: Lane C — deep maintenance sweep
    if: github.event.schedule == '25 8 * * *' || github.event.inputs.lane == 'maintenance'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ingestion-lane-maintenance
      cancel-in-progress: false
    steps:
      - name: Run the deep maintenance sweep
        env:
          CRON_SECRET: ${{ secrets.INTERNSHIP_PILOT_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing repository Actions secret: INTERNSHIP_PILOT_CRON_SECRET"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 295 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$BASE/api/cron/job-ingestion/maintenance"
          echo

      - name: Trigger automatic AI scoring when configured
        # Scoring is independent of ingestion, and runs on the user's own
        # machine. A scoring problem must never make a successful sweep look
        # failed, so this step reports and continues.
        if: always()
        env:
          CRON_SECRET: ${{ secrets.INTERNSHIP_PILOT_CRON_SECRET }}
        run: |
          [ -n "$CRON_SECRET" ] || exit 0
          status="$(curl --silent --show-error --max-time 20 --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --output /tmp/scoring.json --write-out "%{http_code}" \
            "$BASE/api/cron/ai-scoring/trigger" || true)"
          cat /tmp/scoring.json || true
          echo
          if [ -z "$status" ] || [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Automatic scoring trigger returned HTTP ${status:-unknown}; ingestion already succeeded."
          fi
