name: Catalog 500 audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print production source diagnostics
        run: |
          body="$(curl --fail-with-body --silent --show-error --max-time 60 https://internship-pilot.vercel.app/api/health/catalog/sources)"
          echo "$body" | jq .
          echo "MASS_SOURCE_FETCHED=$(echo "$body" | jq -r '.massTechnical.sourceFetched // 0')"
          echo "SIMPLIFY_FETCHED=$(echo "$body" | jq -r '.massTechnical.simplifyFetched // 0')"
          echo "ZAPPLY_FETCHED=$(echo "$body" | jq -r '.massTechnical.zapplyFetched // 0')"
          echo "MASS_ALREADY_ACTIVE=$(echo "$body" | jq -r '.massTechnical.alreadyActive // 0')"
          echo "MASS_UNSEEN=$(echo "$body" | jq -r '.massTechnical.unseen // 0')"
          echo "EXPANDED_SOURCE_FETCHED=$(echo "$body" | jq -r '.expandedDirect.sourceFetched // 0')"
          echo "EXPANDED_UNSEEN=$(echo "$body" | jq -r '.expandedDirect.unseen // 0')"

      - name: Verify production active catalog target
        run: |
          body="$(curl --fail-with-body --silent --show-error --max-time 30 https://internship-pilot.vercel.app/api/health/catalog)"
          echo "$body" | jq .
          active="$(echo "$body" | jq -r '.active')"
          target="$(echo "$body" | jq -r '.activeTarget')"
          reached="$(echo "$body" | jq -r '.targetReached')"
          echo "ACTIVE=$active TARGET=$target REACHED=$reached"
          if [ "$active" -lt 500 ]; then
            echo "Catalog target not reached: $active active jobs"
            exit 1
          fi
