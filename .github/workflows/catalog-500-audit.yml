name: Production catalog health

# Database-usage repair pass #2: this used to run hourly against
# /api/health/catalog, which is exactly the endpoint every open Jobs-page tab
# also polls. Reduced to every 4 hours (6 runs/day instead of 24) — catalog
# depth and freshness targets do not meaningfully regress within a few hours,
# and a real outage is still caught well within a business day. Failure
# detection itself is unchanged: this still fails loudly (non-200, active
# count below target) on every run, just less often.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Measure deployed production catalog
        shell: bash
        run: |
          set -uo pipefail
          tmp="$(mktemp)"
          status="$(curl --silent --show-error --max-time 30 --output "$tmp" --write-out '%{http_code}' https://internship-pilot.vercel.app/api/health/catalog || true)"
          body="$(cat "$tmp")"
          echo "HTTP_STATUS=$status"
          if [ -n "$body" ]; then
            echo "$body" | jq . || printf '%s\n' "$body"
          else
            echo "<empty response body>"
          fi

          if [ "$status" != "200" ]; then
            echo "Production catalog health endpoint is unhealthy (HTTP $status)."
            exit 1
          fi

          active="$(echo "$body" | jq -r '.active // -1')"
          target="$(echo "$body" | jq -r '.activeTarget // 500')"
          fresh24="$(echo "$body" | jq -r '.freshness.postedWithin24h // 0')"
          fresh72="$(echo "$body" | jq -r '.freshness.postedWithin72h // 0')"
          old14="$(echo "$body" | jq -r '.freshness.olderThan14Days // 0')"
          echo "ACTIVE=$active TARGET=$target FRESH_24H=$fresh24 FRESH_72H=$fresh72 OLDER_14D=$old14"

          if [ "$active" -lt "$target" ]; then
            echo "Catalog target not reached: $active/$target active jobs"
            exit 1
          fi
