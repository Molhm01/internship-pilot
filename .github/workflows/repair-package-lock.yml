name: Repair package lock

on:
  push:
    branches:
      - agent/full-publish-readiness-audit
    paths:
      - package.json
      - .github/workflows/repair-package-lock.yml

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-publish-readiness-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rebuild package-lock from a clean dependency graph
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Show production dependency paths that matter to the release audit
        run: |
          npm install --ignore-scripts
          npm explain prisma || true
          npm explain @prisma/config || true
          npm explain deepmerge-ts || true
          npm explain nanoid || true
          npm audit --omit=dev --audit-level=high || true
      - name: Commit repaired lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches a clean regeneration"
            exit 0
          fi
          git config user.name "internship-pilot-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate lockfile from clean dependency graph"
          git push origin HEAD:agent/full-publish-readiness-audit
