<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Acme Corp — Software Engineering Intern Application (Lever)</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    .field { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"], input[type="email"], input[type="tel"], select, textarea {
      width: 100%; padding: 8px; box-sizing: border-box;
    }
    .radio-group label { display: inline-block; font-weight: normal; margin-right: 15px; }
  </style>
</head>
<body>
  <h1>Software Engineering Intern — Summer 2027</h1>
  <h2>Acme Corporation</h2>
  
  <form id="lever-form" action="#" method="POST">
    <div class="field">
      <label for="full-name">Full name*</label>
      <input id="full-name" name="name" type="text" required placeholder="Jane Doe" />
    </div>

    <div class="field">
      <label for="email">Email*</label>
      <input id="email" name="email" type="email" required placeholder="jane@example.com" />
    </div>

    <div class="field">
      <label for="phone">Phone*</label>
      <input id="phone" name="phone" type="tel" required placeholder="(555) 000-0000" />
    </div>

    <div class="field">
      <label for="location">Current location*</label>
      <input id="location" name="location" type="text" required placeholder="San Francisco, CA" />
    </div>

    <div class="field">
      <label for="linkedin">LinkedIn URL</label>
      <input id="linkedin" name="urls[LinkedIn]" type="text" placeholder="https://linkedin.com/in/..." />
    </div>

    <div class="field">
      <label for="resume">Resume/CV*</label>
      <input id="resume" name="resume" type="file" required />
    </div>

    <div class="field radio-group">
      <label>Are you legally authorized to work in the United States?*</label>
      <label><input type="radio" name="cards[work_auth]" value="Yes" required /> Yes</label>
      <label><input type="radio" name="cards[work_auth]" value="No" /> No</label>
    </div>

    <div class="field">
      <label for="referral">How did you hear about this job?*</label>
      <select id="referral" name="cards[referral]" required>
        <option value="">Select an option</option>
        <option value="LinkedIn">LinkedIn</option>
        <option value="University Career Fair">University Career Fair</option>
        <option value="Company Website">Company Website</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="field">
      <button type="submit" id="btn-submit">Submit application</button>
    </div>
  </form>

  <div id="submitted-msg" style="display:none">
    <h3>Application Submitted Successfully!</h3>
  </div>

  <script>
    document.getElementById("lever-form").addEventListener("submit", function(e) {
      e.preventDefault();
      document.body.dataset.submitted = "true";
      document.getElementById("lever-form").style.display = "none";
      document.getElementById("submitted-msg").style.display = "block";
    });
  </script>
</body>
</html>
