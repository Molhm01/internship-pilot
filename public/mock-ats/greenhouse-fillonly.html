<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Mock Greenhouse Application — Apply</title></head>
<body>
  <h1>Apply for Software Engineering Intern</h1>
  <form id="application_form">
    <label for="first_name">First Name*</label>
    <input id="first_name" name="job_application[first_name]" type="text" required />

    <label for="last_name">Last Name*</label>
    <input id="last_name" name="job_application[last_name]" type="text" required />

    <label for="email">Email*</label>
    <input id="email" name="job_application[email]" type="email" required />

    <label for="phone">Phone</label>
    <input id="phone" name="job_application[phone]" type="tel" />

    <label for="school">School*</label>
    <input id="school" name="job_application[school]" type="text" required />

    <label for="degree">Degree*</label>
    <input id="degree" name="job_application[degree]" type="text" required />

    <label for="recent_experience">Most Recent Experience*</label>
    <input id="recent_experience" name="job_application[recent_experience]" type="text" required />

    <label for="linkedin">LinkedIn Profile</label>
    <input id="linkedin" name="job_application[linkedin]" type="text" />

    <label for="resume">Resume/CV*</label>
    <input id="resume" name="job_application[resume]" type="file" required />

    <label for="cover_letter_file">Cover Letter (optional)</label>
    <input id="cover_letter_file" name="job_application[cover_letter]" type="file" />

    <button type="submit" id="submit-app">Submit Application</button>
  </form>
  <div id="confirmation" style="display:none">
    Thank you! Your application has been received. Confirmation Number: GH-55219
  </div>
  <script>
    document.getElementById("application_form").addEventListener("submit", function (e) {
      e.preventDefault();
      document.getElementById("application_form").style.display = "none";
      document.getElementById("confirmation").style.display = "block";
    });
  </script>
</body>
</html>
