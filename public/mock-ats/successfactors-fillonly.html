<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Mock SuccessFactors Application — Apply</title></head>
<body>
  <h1>Apply for Industrial Engineering Intern</h1>
  <form id="application-form">
    <label for="name">Full Name*</label>
    <input id="name" name="name" type="text" required />
    <label for="email">Email*</label>
    <input id="email" name="email" type="email" required />
    <label for="resume">Resume*</label>
    <input id="resume" name="resume" type="file" required />
    <label for="availability">When are you available to start (internship term)?</label>
    <input id="availability" name="availability" type="text" />
    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
