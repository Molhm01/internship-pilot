<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Mock SmartRecruiters Application — Apply</title></head>
<body>
  <h1>Apply for Mechanical Engineering Intern</h1>
  <form id="application-form">
    <label for="name">Full Name*</label>
    <input id="name" name="name" type="text" required />
    <label for="email">Email*</label>
    <input id="email" name="email" type="email" required />
    <label for="resume">Resume*</label>
    <input id="resume" name="resume" type="file" required />
    <label for="relocate">Are you willing to relocate for this role?</label>
    <select id="relocate" name="relocate">
      <option value="">Select...</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>
    <label for="salary">Desired salary expectation</label>
    <input id="salary" name="salary" type="text" />
    <button type="submit">Submit Application</button>
  </form>
  <div id="confirmation" style="display:none">
    Thank you! Your application has been received. Confirmation Number: SR-20194
  </div>
  <script>
    document.getElementById("application-form").addEventListener("submit", function (e) {
      e.preventDefault();
      document.getElementById("application-form").style.display = "none";
      document.getElementById("confirmation").style.display = "block";
    });
  </script>
</body>
</html>
