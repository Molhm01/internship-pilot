<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Mock iCIMS Application — Step 2</title></head>
<body>
  <h1>Voluntary Self-Identification</h1>
  <form id="step2-form">
    <label for="veteran">Veteran status (voluntary self-identification)*</label>
    <select id="veteran" name="veteran" required>
      <option value="">Select...</option>
      <option value="veteran">I am a veteran</option>
      <option value="not-veteran">I am not a veteran</option>
      <option value="decline">I choose not to self-identify</option>
    </select>
    <button type="submit" id="submit-btn">Submit Application</button>
  </form>
</body>
</html>
