<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Mock Ashby Application — Apply</title></head>
<body>
  <h1>Apply for Firmware Intern</h1>
  <div id="captcha-widget" class="captcha-container">Verify you are human</div>
  <form id="ashby-application-form">
    <label for="name">Full Name*</label>
    <input id="name" name="name" type="text" required />
    <label for="email">Email*</label>
    <input id="email" name="email" type="email" required />
    <label for="resume">Resume*</label>
    <input id="resume" name="resume" type="file" required />
    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
